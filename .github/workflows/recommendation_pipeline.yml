name: Recommendation Pipeline

on:
  schedule:
    - cron: '0 10,22 * * *' # Runs at 12:00 (noon) and 00:00 (midnight) Gaborone time (10:00 and 22:00 UTC)
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Minimum required to checkout the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests duckdb==1.5.3

      - name: Run pipeline script
        env:
          CONVEX_HTTP_URL: ${{ secrets.CONVEX_HTTP_URL }}
          MOTHERDUCK_SYNC_SECRET: ${{ secrets.MOTHERDUCK_SYNC_SECRET }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DB_NAME: carplace_analytics
        run: python scripts/recommendation_pipeline.py
