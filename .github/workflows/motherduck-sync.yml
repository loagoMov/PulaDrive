name: Daily MotherDuck Sync

on:
  schedule:
    # Run daily at 1:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    # Allow manual triggering from the GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests duckdb==1.5.3
          
      - name: Run Recommendation & Sync Pipeline
        env:
          CONVEX_HTTP_URL: ${{ secrets.CONVEX_HTTP_URL }}
          MOTHERDUCK_SYNC_SECRET: ${{ secrets.MOTHERDUCK_SYNC_SECRET }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          python scripts/recommendation_pipeline.py
